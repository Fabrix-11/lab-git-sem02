<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mundial 2026</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333;">

    <header style="background-color: #0066cc; color: white; padding: 20px; text-align: center;">
        <h1 style="margin: 0;">Contáctanos</h1>
    </header>

    <nav style="background-color: #004c99; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px; font-weight: bold;">Inicio</a>
        <a href="about.html" style="color: white; text-decoration: none; margin: 0 15px; font-weight: bold;">Sobre el Mundial</a>
        <a href="contact.html" style="color: white; text-decoration: none; margin: 0 15px; font-weight: bold;">Contacto</a>
    </nav>

    <main style="padding: 40px 20px; max-width: 600px; margin: 0 auto;">
        <h2 style="color: #0066cc; text-align: center;">¿Dudas sobre entradas o sedes?</h2>
        
        <form style="background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">Nombre Completo:</label>
            <input type="text" placeholder="Tu nombre" style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">Correo Electrónico:</label>
            <input type="email" placeholder="tu@email.com" style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">Tu Mensaje:</label>
            <textarea rows="5" placeholder="Escribe tu consulta aquí..." style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical;"></textarea>
            
            <button type="button" style="background-color: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px;">
                Enviar Mensaje
            </button>
            
        </form>
    </main>

</body>
</html>
